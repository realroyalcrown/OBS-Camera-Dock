<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS Camera Dock</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #16181c;
      --panel: #202329;
      --panel-2: #272b32;
      --line: #363b44;
      --text: #f3f5f7;
      --muted: #9ca4af;
      --accent: #8b5cf6;
      --accent-2: #a78bfa;
      --ok: #38d996;
      --danger: #ff6b77;
      --track: #3a404a;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      min-width: 240px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px;
      line-height: 1.25;
      user-select: none;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
    }

    h1 {
      margin: 0;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .camera-name {
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--muted);
      font-size: 10px;
      white-space: normal;
    }

    #cameraSelect { width: 100%; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; font: inherit; }
    #statusText { min-width: 0; overflow-wrap: anywhere; }
    .header-actions { flex-shrink: 0; }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--danger) 13%, transparent);
    }

    .dot.connected {
      background: var(--ok);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--ok) 13%, transparent);
    }

    .header-actions {
      display: flex;
      gap: 4px;
      margin-left: 6px;
    }

    .header-actions button {
      width: 22px;
      height: 22px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .header-actions button:hover { border-color: #555d69; background: #2e333b; }

    main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 6px 8px 6px;
      gap: 5px;
    }

    #controls {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .dial-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      padding: 6px 4px 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .dial-card.disabled .dial {
      opacity: .38;
      pointer-events: none;
    }

    .dial-card.unavailable { opacity: .45; }

    .dial-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--muted);
    }

    .dial {
      position: relative;
      width: min(100%, 108px);
      aspect-ratio: 1;
      margin: 4px 0 2px;
      cursor: grab;
      touch-action: none;
    }

    .dial:active { cursor: grabbing; }

    .dial svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .dial-value {
      position: absolute;
      inset: 28% 10% 34%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      color: var(--accent-2);
      pointer-events: none;
      text-align: center;
    }

    .mode-switch {
      display: flex;
      margin-top: 4px;
      padding: 1px;
      border: 1px solid var(--line);
      border-radius: 99px;
      background: var(--panel-2);
    }

    .mode-switch button {
      min-width: 34px;
      padding: 2px 7px;
      border: 0;
      border-radius: 99px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .04em;
      cursor: pointer;
    }

    .mode-switch button.active {
      background: var(--accent);
      color: white;
    }

    .mode-placeholder {
      height: 20px;
      margin-top: 4px;
    }

    .empty {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 12px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      text-align: center;
      color: var(--muted);
      line-height: 1.4;
    }

    .tabs {
      flex: 0 0 auto;
      display: flex;
      gap: 4px;
    }

    .tabs button, .tabs a {
      flex: 1;
      padding: 6px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--muted);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .tabs button:hover { border-color: #555d69; background: #2e333b; }
    .tabs button.active {
      color: var(--text);
      border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
      background: color-mix(in srgb, var(--accent) 24%, var(--panel-2));
    }

    .preset-bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .preset-bar select {
      min-width: 0;
      flex: 1;
      height: 24px;
      padding: 0 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
    }

    .preset-bar button {
      flex: 0 0 auto;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .preset-bar button:hover { border-color: #555d69; background: #2e333b; }

    .dialog {
      position: fixed;
      inset: 0;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #0006;
    }

    .dialog-card {
      width: min(280px, 100%);
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 30px #0008;
    }

    .dialog-title {
      margin-bottom: 8px;
      font-weight: 650;
    }

    .dialog-card input {
      width: 100%;
      margin-bottom: 8px;
      padding: 6px 7px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
    }

    .dialog-actions {
      display: flex;
      gap: 4px;
    }

    .dialog-actions button {
      flex: 1;
      padding: 5px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      cursor: pointer;
    }

    .dialog-actions .confirm {
      border-color: color-mix(in srgb, var(--accent) 70%, var(--line));
      background: color-mix(in srgb, var(--accent) 24%, var(--panel-2));
    }

    .toast.ok {
      border-color: color-mix(in srgb, var(--ok) 55%, var(--line));
      background: #1b3329;
      color: #d4ffe8;
    }

    .toast {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 8px;
      z-index: 5;
      padding: 7px 9px;
      border: 1px solid color-mix(in srgb, var(--danger) 55%, var(--line));
      border-radius: 6px;
      background: #351f25;
      color: #ffd9dd;
      box-shadow: 0 6px 18px #0008;
    }

    .hidden { display: none !important; }
    .tabs a { text-align: center; text-decoration: none; }
    .tabs a[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Camera Dock</h1>
      <div id="cameraName" class="camera-name">Razer Kiyo V2 X</div>
      <select id="cameraSelect" aria-label="Vybrat kameru" style="max-width:100%" hidden></select>
    </div>
    <div class="status-row">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Připojování…</span>
      <div class="header-actions">
        <button id="rescan" type="button" title="Vyhledat kameru">↻</button>
        <button id="reset" type="button" title="Výchozí hodnoty">↺</button>
      </div>
    </div>
  </header>

  <main>
    <section id="controls"></section>
    <div class="preset-bar">
      <select id="presetSelect" aria-label="Preset panelu">
        <option value="">Preset…</option>
      </select>
      <button id="presetLoad" type="button">Načíst</button>
      <button id="presetCreate" type="button">Nový</button>
      <button id="presetSave" type="button">Uložit</button>
      <button id="presetDelete" type="button">Smazat</button>
    </div>
    <nav class="tabs" id="tabs">
      <button type="button" data-panel="expo" class="active">Expo</button>
      <button type="button" data-panel="obraz">Obraz</button>
      <button type="button" data-panel="optika">Optika</button>
      <a id="faceLink" href="/face" hidden>Obličej</a>
    </nav>
  </main>

  <div id="dialog" class="dialog hidden">
    <div class="dialog-card">
      <div id="dialogTitle" class="dialog-title">Nový preset</div>
      <input id="dialogInput" maxlength="40" placeholder="Název presetu">
      <div class="dialog-actions">
        <button id="dialogCancel" type="button">Zrušit</button>
        <button id="dialogOk" type="button" class="confirm">OK</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden" role="alert"></div>

  <script>
    const START_DEG = 135;
    const SWEEP_DEG = 270;
    const CX = 50;
    const CY = 50;
    const RADIUS = 38;
    const SHUTTER_DENOMS = [1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 60, 80, 100, 125, 160, 200, 250, 320, 400, 500, 640, 800, 1000, 1250, 1600, 2000, 2500, 3200, 4000, 5000, 6400, 8000];
    const ISO_STOPS = [100, 125, 160, 200, 250, 320, 400, 500, 640, 800, 1000, 1250, 1600];
    const WB_WARM = 2800;
    const WB_COOL = 6500;

    const PANELS = [
      {
        id: 'expo',
        label: 'Expo',
        dials: [
          { id: 'exposureTime', label: 'EXP', autoId: 'exposureAuto', format: 'shutter' },
          { id: 'gain', label: 'ISO', format: 'iso' },
          { id: 'brightness', label: 'JAS', format: 'percent' },
          { id: 'focus', label: 'FOCUS', autoId: 'focusAuto', format: 'focus' }
        ]
      },
      {
        id: 'obraz',
        label: 'Obraz',
        dials: [
          { id: 'contrast', label: 'KONTR', format: 'percent' },
          { id: 'saturation', label: 'SAT', format: 'percent' },
          { id: 'sharpness', label: 'OSTR', format: 'percent' },
          { id: 'whiteBalance', label: 'WB', autoId: 'whiteBalanceAuto', format: 'kelvin' }
        ]
      },
      {
        id: 'optika',
        label: 'Optika',
        dials: [
          { id: 'zoom', label: 'ZOOM', format: 'percent' },
          { id: 'tilt', label: 'TILT', format: 'degree' },
          { id: 'pan', label: 'PAN', format: 'degree' },
          { id: 'backlight', label: 'BLC', format: 'percent' }
        ]
      }
    ];

    const controlsElement = document.querySelector('#controls');
    const cameraNameElement = document.querySelector('#cameraName');
    const statusTextElement = document.querySelector('#statusText');
    const statusDotElement = document.querySelector('#statusDot');
    const toastElement = document.querySelector('#toast');
    const presetSelect = document.querySelector('#presetSelect');
    const dialogElement = document.querySelector('#dialog');
    const dialogTitle = document.querySelector('#dialogTitle');
    const dialogInput = document.querySelector('#dialogInput');
    const localValues = new Map();
    const timers = new Map();
    let controls = [];
    let presets = { expo: { items: [], selectedId: null }, obraz: { items: [], selectedId: null }, optika: { items: [], selectedId: null } };
    let activeDrag = null;
    let activePanel = 'expo';
    let connected = false;
    let cameraDeviceId = null;
    let dialogMode = 'create';

    function escapeText(value) {
      const node = document.createElement('span');
      node.textContent = String(value ?? '');
      return node.innerHTML;
    }

    function specById(id) {
      for (const panel of PANELS) {
        const spec = panel.dials.find(item => item.id === id || item.autoId === id);
        if (spec) return spec;
      }
      return null;
    }

    async function request(path, options = {}) {
      if (options.method === 'POST' && cameraDeviceId && path !== '/api/camera' && path !== '/api/rescan') {
        options = { ...options, body: JSON.stringify({ ...JSON.parse(options.body || '{}'), cameraDeviceId }) };
      }
      const response = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }

    function showError(error) {
      toastElement.textContent = error.message || String(error);
      toastElement.classList.remove('hidden', 'ok');
      clearTimeout(showError.timer);
      showError.timer = setTimeout(() => toastElement.classList.add('hidden'), 5000);
    }

    function showOk(message) {
      toastElement.textContent = message;
      toastElement.classList.add('ok');
      toastElement.classList.remove('hidden');
      clearTimeout(showError.timer);
      showError.timer = setTimeout(() => toastElement.classList.add('hidden'), 1800);
    }

    function byId(id) {
      return controls.find(item => item.id === id);
    }

    function polar(deg) {
      const rad = deg * Math.PI / 180;
      return { x: CX + RADIUS * Math.cos(rad), y: CY + RADIUS * Math.sin(rad) };
    }

    function describeArc(fromDeg, toDeg) {
      const start = polar(fromDeg);
      const end = polar(toDeg);
      const delta = ((toDeg - fromDeg) + 360) % 360;
      const large = delta > 180 ? 1 : 0;
      return `M ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${RADIUS} ${RADIUS} 0 ${large} 1 ${end.x.toFixed(2)} ${end.y.toFixed(2)}`;
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function nearest(list, value) {
      return list.reduce((best, item) => Math.abs(item - value) < Math.abs(best - value) ? item : best);
    }

    function uvcFromShutter(denom) {
      return Math.max(1, Math.round(10000 / denom));
    }

    function shutterStops(control) {
      if (control.encoding === 'log2Seconds') {
        const stops = [];
        for (let value = control.maximum; value >= control.minimum; value -= Math.max(1, control.step)) {
          stops.push(Math.pow(2, -value));
        }
        return stops;
      }
      const stops = SHUTTER_DENOMS.filter(denom => {
        const uvc = uvcFromShutter(denom);
        return uvc >= control.minimum && uvc <= control.maximum;
      });
      return stops.length ? stops : SHUTTER_DENOMS;
    }

    function wbRange(control) {
      const min = Math.max(control.minimum, WB_WARM);
      const max = Math.min(control.maximum, WB_COOL);
      if (max <= min) return { min: control.minimum, max: control.maximum };
      return { min, max };
    }

    function percentOf(control, value) {
      const span = control.maximum - control.minimum;
      if (span <= 0) return 0;
      return Math.round(clamp((value - control.minimum) / span, 0, 1) * 100);
    }

    function focusDisplayOf(control, value) {
      if (control.focusRawScale) return percentOf(control, value);
      return 100 - percentOf(control, value);
    }

    function shutterDenom(control, value) {
      return control.encoding === 'log2Seconds' ? Math.pow(2, -value) : Math.max(1, Math.round(10000 / Math.max(1, value)));
    }

    function shutterValue(control, denom) {
      return control.encoding === 'log2Seconds' ? Math.round(-Math.log2(denom)) : uvcFromShutter(denom);
    }

    function uvcFromPercent(control, percent) {
      const span = control.maximum - control.minimum;
      const step = Math.max(1, control.step || 1);
      const raw = control.minimum + (clamp(percent, 0, 100) / 100) * span;
      return clamp(Math.round(raw / step) * step, control.minimum, control.maximum);
    }

    function isoFromGain(control, value) {
      const span = control.maximum - control.minimum;
      if (span <= 0) return ISO_STOPS[0];
      const t = clamp((value - control.minimum) / span, 0, 1);
      return nearest(ISO_STOPS, 100 * Math.pow(16, t));
    }

    function gainFromIso(control, iso) {
      const t = Math.log(clamp(iso, 100, 1600) / 100) / Math.log(16);
      const span = control.maximum - control.minimum;
      const step = Math.max(1, control.step || 1);
      const raw = control.minimum + t * span;
      return clamp(Math.round(raw / step) * step, control.minimum, control.maximum);
    }

    function ratioOf(control, spec, value) {
      if (spec.format === 'shutter') {
        const stops = shutterStops(control);
        const denom = nearest(stops, shutterDenom(control, value));
        const index = stops.indexOf(denom);
        return stops.length <= 1 ? 0 : index / (stops.length - 1);
      }
      if (spec.format === 'iso') {
        const iso = isoFromGain(control, value);
        const index = ISO_STOPS.indexOf(iso);
        return index / (ISO_STOPS.length - 1);
      }
      if (spec.format === 'percent') {
        return percentOf(control, value) / 100;
      }
      if (spec.format === 'focus') {
        return focusDisplayOf(control, value) / 100;
      }
      if (spec.format === 'kelvin') {
        const range = wbRange(control);
        const span = range.max - range.min;
        if (span <= 0) return 0;
        return clamp((value - range.min) / span, 0, 1);
      }
      const span = control.maximum - control.minimum;
      if (span <= 0) return 0;
      return clamp((value - control.minimum) / span, 0, 1);
    }

    function valueFromRatio(control, spec, ratio) {
      const t = clamp(ratio, 0, 1);
      if (spec.format === 'shutter') {
        const stops = shutterStops(control);
        const index = Math.round(t * (stops.length - 1));
        return shutterValue(control, stops[index]);
      }
      if (spec.format === 'iso') {
        const index = Math.round(t * (ISO_STOPS.length - 1));
        return gainFromIso(control, ISO_STOPS[index]);
      }
      if (spec.format === 'percent') {
        return uvcFromPercent(control, Math.round(t * 100));
      }
      if (spec.format === 'focus') {
        return uvcFromPercent(control, control.focusRawScale ? Math.round(t * 100) : 100 - Math.round(t * 100));
      }
      if (spec.format === 'kelvin') {
        const range = wbRange(control);
        const kelvin = Math.round((range.min + t * (range.max - range.min)) / 50) * 50;
        const step = Math.max(1, control.step || 1);
        return clamp(Math.round(kelvin / step) * step, control.minimum, control.maximum);
      }
      const span = control.maximum - control.minimum;
      const step = Math.max(1, control.step || 1);
      const raw = control.minimum + span * t;
      return clamp(Math.round(raw / step) * step, control.minimum, control.maximum);
    }

    function stepValue(control, spec, value, direction) {
      if (spec.format === 'shutter') {
        const stops = shutterStops(control);
        const denom = nearest(stops, shutterDenom(control, value));
        const index = clamp(stops.indexOf(denom) + direction, 0, stops.length - 1);
        return shutterValue(control, stops[index]);
      }
      if (spec.format === 'iso') {
        const iso = isoFromGain(control, value);
        const index = clamp(ISO_STOPS.indexOf(iso) + direction, 0, ISO_STOPS.length - 1);
        return gainFromIso(control, ISO_STOPS[index]);
      }
      if (spec.format === 'percent') {
        return uvcFromPercent(control, percentOf(control, value) + direction);
      }
      if (spec.format === 'focus') {
        return uvcFromPercent(control, percentOf(control, value) + (control.focusRawScale ? direction : -direction));
      }
      if (spec.format === 'kelvin') {
        return valueFromRatio(control, spec, ratioOf(control, spec, value) + direction * 0.04);
      }
      const step = Math.max(1, control.step || 1) * direction;
      return clamp(value + step, control.minimum, control.maximum);
    }

    function kelvinColor(kelvin) {
      const t = clamp((kelvin - WB_WARM) / (WB_COOL - WB_WARM), 0, 1);
      const r = Math.round(142 + t * (255 - 142));
      const g = Math.round(200 - t * 70);
      const b = Math.round(255 - t * 180);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function formatValue(control, spec, value) {
      if (value == null) return '—';
      if (spec.format === 'shutter') {
        const denom = nearest(shutterStops(control), shutterDenom(control, value));
        return denom <= 1 ? `${1 / denom}″` : `1/${denom}`;
      }
      if (spec.format === 'iso') return String(isoFromGain(control, value));
      if (spec.format === 'percent') return String(percentOf(control, value));
      if (spec.format === 'focus') return String(focusDisplayOf(control, value));
      if (spec.format === 'kelvin') return `${Math.round(value / 50) * 50}K`;
      if (spec.format === 'degree') return `${value}°`;
      return String(value);
    }

    function angleFromPointer(el, event) {
      const rect = el.getBoundingClientRect();
      const dx = event.clientX - (rect.left + rect.width / 2);
      const dy = event.clientY - (rect.top + rect.height / 2);
      return (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
    }

    function ratioFromAngle(deg) {
      const rel = (deg - START_DEG + 360) % 360;
      if (rel > SWEEP_DEG) return rel > SWEEP_DEG + (360 - SWEEP_DEG) / 2 ? 0 : 1;
      return rel / SWEEP_DEG;
    }

    function dialMarkup(spec) {
      const control = byId(spec.id);
      const auto = spec.autoId ? byId(spec.autoId) : null;
      const available = Boolean(control);
      const autoOn = Boolean(auto && localValues.get(spec.autoId));
      const value = available ? localValues.get(spec.id) : null;
      const ratio = available ? ratioOf(control, spec, value) : 0;
      const end = START_DEG + SWEEP_DEG * ratio;
      const thumb = polar(end);
      const track = describeArc(START_DEG, START_DEG + SWEEP_DEG);
      const arc = ratio > 0.001 ? describeArc(START_DEG, end) : '';
      const arcColor = spec.format === 'kelvin' && available ? kelvinColor(value) : 'var(--accent)';
      const mode = spec.autoId && byId(spec.autoId)
        ? `<div class="mode-switch" data-auto="${escapeText(spec.autoId)}">
            <button type="button" data-mode="auto" class="${autoOn ? 'active' : ''}">AUTO</button>
            <button type="button" data-mode="manual" class="${autoOn ? '' : 'active'}">MAN</button>
          </div>`
        : `<div class="mode-placeholder"></div>`;

      return `<article class="dial-card${available ? '' : ' unavailable'}${autoOn ? ' disabled' : ''}" data-id="${escapeText(spec.id)}" data-auto="${escapeText(spec.autoId || '')}">
        <div class="dial-label">${escapeText(spec.label)}</div>
        <div class="dial" role="slider" aria-label="${escapeText(spec.label)}">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="${track}" fill="none" stroke="var(--track)" stroke-width="7" stroke-linecap="round"></path>
            <path class="value-arc" d="${arc}" fill="none" stroke="${arcColor}" stroke-width="7" stroke-linecap="round"></path>
            <circle class="thumb" cx="${thumb.x.toFixed(2)}" cy="${thumb.y.toFixed(2)}" r="5.2" fill="white"></circle>
          </svg>
          <div class="dial-value">${available ? escapeText(formatValue(control, spec, value)) : '—'}</div>
        </div>
        ${mode}
      </article>`;
    }

    function currentPanel() {
      return PANELS.find(panel => panel.id === activePanel) || PANELS[0];
    }

    function currentPresets() {
      return presets[activePanel] || { items: [], selectedId: null };
    }

    function selectedPresetId() {
      return presetSelect.value;
    }

    function renderPresetSelect() {
      const box = currentPresets();
      const selected = box.selectedId || '';
      presetSelect.innerHTML = `<option value="">Preset…</option>` + box.items.map(item =>
        `<option value="${escapeText(item.id)}"${item.id === selected ? ' selected' : ''}>${escapeText(item.name)}</option>`
      ).join('');
    }

    function openDialog(mode) {
      dialogMode = mode;
      const selected = currentPresets().items.find(item => item.id === selectedPresetId());
      dialogTitle.textContent = mode === 'delete'
        ? `Smazat preset „${selected?.name || ''}“?`
        : 'Nový preset';
      dialogInput.value = '';
      dialogInput.classList.toggle('hidden', mode === 'delete');
      dialogElement.classList.remove('hidden');
      if (mode !== 'delete') dialogInput.focus();
    }

    function closeDialog() {
      dialogElement.classList.add('hidden');
    }

    function renderPanel() {
      document.querySelectorAll('#tabs button').forEach(button => {
        button.classList.toggle('active', button.dataset.panel === activePanel);
      });
      renderPresetSelect();

      if (!connected) {
        controlsElement.innerHTML = `<div class="empty">${escapeText(statusTextElement.textContent)}<br>Zkontrolujte USB připojení a spusťte nové vyhledání.</div>`;
        return;
      }

      const supported = currentPanel().dials.filter(spec => byId(spec.id));
      controlsElement.innerHTML = supported.length ? supported.map(dialMarkup).join('') : '<div class="empty">Kamera v tomto panelu nenabízí žádné ovladače.</div>';
      bindControls();
    }

    function render(state) {
      document.querySelector('#faceLink').hidden = !state.faceSupported;
      cameraDeviceId = state.deviceId || null;
      const cameraSelect = document.querySelector('#cameraSelect');
      cameraSelect.hidden = !Array.isArray(state.cameras);
      if (Array.isArray(state.cameras)) {
        cameraSelect.replaceChildren(new Option('Vyberte kameru…', ''));
        for (const camera of state.cameras) cameraSelect.add(new Option(camera.name, camera.id));
        cameraSelect.value = state.deviceId || '';
      }
      controls = state.controls || [];
      presets = state.presets || presets;
      localValues.clear();
      connected = Boolean(state.connected);
      for (const control of controls) {
        localValues.set(control.id, control.kind === 'toggle' ? control.enabled : control.value);
      }

      cameraNameElement.textContent = state.cameraName || 'UVC kamera';
      statusTextElement.textContent = state.message;
      statusDotElement.classList.toggle('connected', connected);
      renderPanel();
    }

    function updateDial(id) {
      const card = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
      const control = byId(id);
      const spec = specById(id);
      if (!card || !control || !spec || spec.id !== id) return;
      const autoOn = Boolean(spec.autoId && localValues.get(spec.autoId));
      const value = localValues.get(id);
      const ratio = ratioOf(control, spec, value);
      const end = START_DEG + SWEEP_DEG * ratio;
      const thumbPos = polar(end);
      const arc = card.querySelector('.value-arc');
      const thumb = card.querySelector('.thumb');
      const label = card.querySelector('.dial-value');
      if (arc) {
        arc.setAttribute('d', ratio > 0.001 ? describeArc(START_DEG, end) : '');
        if (spec.format === 'kelvin') arc.setAttribute('stroke', kelvinColor(value));
      }
      if (thumb) {
        thumb.setAttribute('cx', thumbPos.x.toFixed(2));
        thumb.setAttribute('cy', thumbPos.y.toFixed(2));
      }
      if (label) label.textContent = formatValue(control, spec, value);
      card.classList.toggle('disabled', autoOn);
      if (spec.autoId) {
        card.querySelector('[data-mode="auto"]')?.classList.toggle('active', autoOn);
        card.querySelector('[data-mode="manual"]')?.classList.toggle('active', !autoOn);
      }
    }

    function setDialValue(id, value, send) {
      const control = byId(id);
      if (!control) return;
      const next = clamp(value, control.minimum, control.maximum);
      localValues.set(id, next);
      updateDial(id);
      if (send) scheduleUpdate(id, next);
    }

    function bindControls() {
      document.querySelectorAll('.dial').forEach(dial => {
        const card = dial.closest('.dial-card');
        const id = card.dataset.id;
        const control = byId(id);
        const spec = specById(id);
        if (!control || !spec) return;

        dial.addEventListener('pointerdown', event => {
          if (card.classList.contains('disabled')) return;
          event.preventDefault();
          dial.setPointerCapture(event.pointerId);
          activeDrag = id;
          setDialValue(id, valueFromRatio(control, spec, ratioFromAngle(angleFromPointer(dial, event))), true);
        });

        dial.addEventListener('pointermove', event => {
          if (activeDrag !== id || !dial.hasPointerCapture(event.pointerId)) return;
          setDialValue(id, valueFromRatio(control, spec, ratioFromAngle(angleFromPointer(dial, event))), true);
        });

        dial.addEventListener('pointerup', event => {
          if (activeDrag === id) {
            activeDrag = null;
            sendUpdate(id, { value: localValues.get(id) });
          }
          if (dial.hasPointerCapture(event.pointerId)) dial.releasePointerCapture(event.pointerId);
        });

        dial.addEventListener('wheel', event => {
          if (card.classList.contains('disabled')) return;
          event.preventDefault();
          const direction = event.deltaY > 0 ? -1 : 1;
          setDialValue(id, stepValue(control, spec, Number(localValues.get(id) || 0), direction), true);
        }, { passive: false });
      });

      document.querySelectorAll('.mode-switch').forEach(group => {
        group.querySelectorAll('button').forEach(button => {
          button.addEventListener('click', () => {
            const autoId = group.dataset.auto;
            const enabled = button.dataset.mode === 'auto';
            localValues.set(autoId, enabled);
            const spec = specById(autoId);
            if (spec) updateDial(spec.id);
            sendUpdate(autoId, { enabled });
          });
        });
      });
    }

    function scheduleUpdate(id, value) {
      clearTimeout(timers.get(id));
      timers.set(id, setTimeout(() => sendUpdate(id, { value }), 90));
    }

    async function sendUpdate(id, payload) {
      clearTimeout(timers.get(id));
      timers.delete(id);
      try {
        const state = await request('/api/control', {
          method: 'POST',
          body: JSON.stringify({ id, ...payload })
        });
        if (!activeDrag && timers.size === 0) render(state);
      } catch (error) {
        showError(error);
      }
    }

    async function loadState() {
      try {
        render(await request('/api/state'));
      } catch (error) {
        connected = false;
        statusTextElement.textContent = 'Helper není dostupný';
        statusDotElement.classList.remove('connected');
        showError(error);
        renderPanel();
      }
    }

    async function presetAction(path, extra = {}) {
      render(await request(path, {
        method: 'POST',
        body: JSON.stringify({ panel: activePanel, ...extra })
      }));
    }

    document.querySelectorAll('#tabs button').forEach(button => {
      button.addEventListener('click', () => {
        activePanel = button.dataset.panel;
        renderPanel();
      });
    });

    document.querySelector('#presetLoad').addEventListener('click', async () => {
      try {
        if (!selectedPresetId()) throw new Error('Vyberte preset.');
        await presetAction('/api/presets/load', { id: selectedPresetId() });
        showOk('Preset načten');
      } catch (error) { showError(error); }
    });

    document.querySelector('#presetCreate').addEventListener('click', () => openDialog('create'));
    document.querySelector('#presetSave').addEventListener('click', async () => {
      try {
        if (!selectedPresetId()) throw new Error('Vyberte preset, nebo nejdřív vytvořte nový.');
        await presetAction('/api/presets/save', { id: selectedPresetId() });
        showOk('Preset uložen');
      } catch (error) { showError(error); }
    });
    document.querySelector('#presetDelete').addEventListener('click', () => {
      if (!selectedPresetId()) {
        showError(new Error('Vyberte preset.'));
        return;
      }
      openDialog('delete');
    });

    document.querySelector('#dialogCancel').addEventListener('click', closeDialog);
    document.querySelector('#dialogOk').addEventListener('click', async () => {
      try {
        if (dialogMode === 'delete') {
          await presetAction('/api/presets/delete', { id: selectedPresetId() });
          showOk('Preset smazán');
        } else {
          await presetAction('/api/presets/create', { name: dialogInput.value });
          showOk('Preset vytvořen');
        }
        closeDialog();
      } catch (error) { showError(error); }
    });
    dialogInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') document.querySelector('#dialogOk').click();
      if (event.key === 'Escape') closeDialog();
    });

    document.querySelector('#rescan').addEventListener('click', async () => {
      try { render(await request('/api/rescan', { method: 'POST', body: '{}' })); }
      catch (error) { showError(error); }
    });

    document.querySelector('#cameraSelect').addEventListener('change', async event => {
      const id = event.target.value;
      if (!id) return;
      for (const timer of timers.values()) clearTimeout(timer);
      timers.clear(); activeDrag = null;
      try { render(await request('/api/camera', { method: 'POST', body: JSON.stringify({ id }) })); }
      catch (error) { showError(error); }
    });

    document.querySelector('#reset').addEventListener('click', async () => {
      try { render(await request('/api/reset', { method: 'POST', body: '{}' })); }
      catch (error) { showError(error); }
    });

    loadState();
  </script>
</body>
</html>
